name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt numpy Pillow requests
      - name: Check Python syntax
        run: python -m compileall -q install.py scripts snapref_webui tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
